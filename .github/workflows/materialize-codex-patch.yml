name: Materialize Codex patch

on:
  push:
    branches:
      - codex-transfer

permissions:
  contents: write
  issues: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified baseline
        uses: actions/checkout@v4
        with:
          ref: 5776a5140430ac8644e3fbad7d23e2ae9d3b07ee
          fetch-depth: 0

      - name: Reconstruct verified patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          url = f'https://api.github.com/repos/{repo}/issues/4/comments?per_page=100'
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as r:
              comments = json.load(r)
          chunks = {}
          total = None
          for c in comments:
              body = c.get('body') or ''
              m = re.match(r'^chunk=(\d+)/(\d+)\n([A-Za-z0-9+/=]+)$', body)
              if not m:
                  continue
              n, t = int(m.group(1)), int(m.group(2))
              if total is None:
                  total = t
              if t != total or n in chunks:
                  raise SystemExit('invalid chunk metadata')
              chunks[n] = m.group(3)
          diag = [f'{i}:{len(chunks[i])}:{hashlib.sha256(chunks[i].encode()).hexdigest()[:16]}' for i in sorted(chunks)]
          diag_text = 'transfer diagnostics\n' + '\n'.join(diag)
          if total == 9 and sorted(chunks) == list(range(1, 10)):
              encoded = ''.join(chunks[i] for i in range(1, total + 1))
              try:
                  compressed = base64.b64decode(encoded, validate=True)
                  digest = hashlib.sha256(compressed).hexdigest()
                  diag_text += f'\nencoded={len(encoded)} decoded={len(compressed)} digest={digest}'
              except Exception as exc:
                  compressed = None
                  digest = None
                  diag_text += f'\ndecode_error={exc!r}'
          else:
              compressed = None
              digest = None
              diag_text += f'\ntotal={total} got={sorted(chunks)}'
          data = json.dumps({'body': diag_text}).encode()
          post = urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/4/comments', data=data, headers={**headers, 'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(post) as r:
              r.read()
          if total != 9 or sorted(chunks) != list(range(1, 10)):
              raise SystemExit('incomplete chunk set')
          expected = '75ac38f1b98cf0877ff864c8cce756825d049d9094dcaf9341d165fdb95af570'
          if digest != expected:
              raise SystemExit(f'patch checksum mismatch: {digest}')
          patch = gzip.decompress(compressed)
          open('/tmp/skan.patch', 'wb').write(patch)
          print(f'verified patch: {len(patch)} bytes')
          PY

      - name: Apply patch and validate diff
        run: |
          git apply --index --check /tmp/skan.patch
          git apply --index /tmp/skan.patch
          git diff --cached --check

      - name: Build focused changed areas
        run: |
          make -j2 \
            build/test_service_db \
            build/test_service_matcher \
            build/test_service_corpus \
            build/test_tls_metadata \
            build/test_service_scheduler \
            build/test_service_detector \
            build/test_service_detection_local \
            build/test_output_normal \
            build/test_output_json \
            build/test_output_xml \
            build/test_output_grepable \
            bin/skan

      - name: Run focused tests
        run: |
          for t in \
            build/test_service_db \
            build/test_service_matcher \
            build/test_service_corpus \
            build/test_tls_metadata \
            build/test_service_scheduler \
            build/test_service_detector \
            build/test_service_detection_local \
            build/test_output_normal \
            build/test_output_json \
            build/test_output_xml \
            build/test_output_grepable; do
            "$t"
          done
          ./bin/skan --version

      - name: Commit exact verified tree
        run: |
          git config user.name "Adam Ghanem"
          git config user.email "adam.ghanem.it@gmail.com"
          git commit -m "Expand service fingerprinting and TLS metadata"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$tree" = "6d19a3a7fbeb56fc52d3dbcafd917626b0f900d8"
          echo "verified tree: $tree"

      - name: Push materialized commit
        run: git push origin HEAD:refs/heads/codex-materialized
