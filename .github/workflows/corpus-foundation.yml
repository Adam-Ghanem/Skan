name: Fingerprint Corpus CI

on:
  push:
    branches: [main]
    paths:
      - 'corpus/**'
      - 'tools/corpus/**'
      - 'tests/corpus/**'
      - '.github/workflows/corpus-foundation.yml'
      - 'GNUmakefile'
  pull_request:
    paths:
      - 'corpus/**'
      - 'tools/corpus/**'
      - 'tests/corpus/**'
      - '.github/workflows/corpus-foundation.yml'
      - 'GNUmakefile'

permissions:
  contents: read

jobs:
  corpus-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify fingerprint corpus
        run: make corpus-verify
