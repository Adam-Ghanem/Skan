name: Materialize terminal identity

on:
  push:
    branches:
      - codex/terminal-identity

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect transfer payload
        id: payload
        shell: bash
        run: |
          if [[ -f .github/terminal-identity.patch.gz.b64 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and verify patch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/terminal-identity.patch.gz.b64 | gzip -dc > /tmp/terminal-identity.patch
          echo "76e2d863ea1b3cd7b646ca949a707e3209a95899945160ca3dc112fd139c5aba  /tmp/terminal-identity.patch" | sha256sum -c -
          git apply --check /tmp/terminal-identity.patch

      - name: Apply patch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/terminal-identity.patch
          git rm .github/terminal-identity.patch.gz.b64 .github/workflows/materialize-terminal-identity.yml
          git diff --cached --check

      - name: Build focused targets
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          make -j2 \
            build/test_log \
            build/test_output_normal \
            build/test_output_json \
            build/test_output_xml \
            build/test_output_grepable \
            build/test_output_manager \
            build/test_output_integration \
            build/test_scan_config \
            build/test_pipeline \
            bin/skan

      - name: Run focused tests
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for test_bin in \
            build/test_log \
            build/test_output_normal \
            build/test_output_json \
            build/test_output_xml \
            build/test_output_grepable \
            build/test_output_manager \
            build/test_output_integration \
            build/test_scan_config \
            build/test_pipeline; do
            "$test_bin"
          done
          SKAN_BIN=./bin/skan bash tests/integration/cli/test_nmap_compat.sh

      - name: Commit materialized change
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Adam Ghanem"
          git config user.email "adam.ghanem.it@gmail.com"
          git commit -m "Add Skan terminal identity"
          git push origin HEAD:codex/terminal-identity
