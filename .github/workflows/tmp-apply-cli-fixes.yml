name: Apply Verified CLI Fixes

on:
  push:
    branches:
      - codex/fingerprint-corpus-v2-multisource
    paths:
      - .github/workflows/tmp-apply-cli-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/fingerprint-corpus-v2-multisource
          fetch-depth: 1
          persist-credentials: false

      - name: Apply verified RED-to-GREEN fixes and remove helper
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="codex/fingerprint-corpus-v2-multisource"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"

          apply_patch() {
            python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main.cpp")
          text = path.read_text(encoding="utf-8")

          transport_old = '''    config.adaptive_timing = adaptive_timing;
              if (transport_mode == "connect") {
          '''
          transport_new = '''    config.adaptive_timing = adaptive_timing;
              if (config.os_detection_enabled && transport_mode.empty() && !config.udp_enabled) {
                  transport_mode = "linux";
                  config.port_method = skan::portscan::ScanProbeType::TcpSyn;
              }
              if (transport_mode == "connect") {
          '''
          if transport_new not in text:
              if text.count(transport_old) != 1:
                  raise SystemExit("expected one scan transport assignment anchor")
              text = text.replace(transport_old, transport_new, 1)

          target_old = '''    if (targets.empty()) {
                  std::cerr << "Error: Nmap-compatible mode requires at least one target specification.\\n";
                  return EXIT_FAILURE;
              }
          '''
          target_new = '''    if (targets.empty()) {
                  if (std::find(options.begin(), options.end(), "-o") != options.end()) {
                      std::cerr << "Error: -o/--output-file requires a file path and a target; did you mean -O for OS detection?\\n";
                  } else {
                      std::cerr << "Error: Nmap-compatible mode requires at least one target specification.\\n";
                  }
                  return EXIT_FAILURE;
              }
          '''
          if target_new not in text:
              if text.count(target_old) != 1:
                  raise SystemExit("expected one Nmap-compatible empty-target anchor")
              text = text.replace(target_old, target_new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --no-tags origin "$branch"
            git reset --hard "origin/$branch"
            apply_patch
            git rm -f .github/workflows/tmp-apply-cli-fixes.yml
            git add src/main.cpp
            if git diff --cached --quiet; then
              echo "Verified CLI fixes are already applied"
              exit 0
            fi
            git commit -m "fix(cli): make default OS detection capability-aware"
            if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              push https://github.com/${GITHUB_REPOSITORY}.git HEAD:"$branch"; then
              exit 0
            fi
            echo "CLI fix publish raced with another branch update; retrying ($attempt/3)"
          done

          echo "Unable to publish verified CLI fixes after retries" >&2
          exit 1
