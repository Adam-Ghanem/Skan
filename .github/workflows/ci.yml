name: Skan CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: skan-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          make --version | head -1
          g++ --version | head -1
          clang++ --version || true

      - name: Validate privileged harness
        run: |
          make check-line-endings
          bash -n scripts/privileged_validation.sh
          test -x scripts/privileged_validation.sh

      - name: Clean production build and tests
        run: |
          make clean
          make -j2
          make -j2 test

      - name: Nmap-compatible CLI regression
        run: |
          bash tests/integration/cli/test_nmap_compat.sh
          python3 tests/integration/cli/test_terminal_policy.py

      - name: Repository clean
        run: |
          make clean
          test -z "$(git status --porcelain)"

  build-flavors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [debug, release]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build ${{ matrix.target }}
        run: make ${{ matrix.target }}

  dynamic-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [asan, ubsan, coverage]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run ${{ matrix.target }}
        run: make -j2 ${{ matrix.target }}

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Benchmark isolation
        run: |
          make -j2 benchmark
          ./build/benchmark_offline >/tmp/skan-benchmark.csv
          test -s /tmp/skan-benchmark.csv

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fuzz target or capability-aware fallback
        run: |
          make fuzz
          if ! command -v clang++ >/dev/null 2>&1; then
            g++ -Iinclude -std=c++20 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wformat=2 \
              -O2 -c tests/fuzz/fuzz_packet_parsers.cpp -o /tmp/fuzz_packet_parsers.o
          fi

  static-security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate workflow policy
        run: |
          python3 -m unittest tests/security/test_workflow_policy.py
          python3 scripts/validate_workflow_policy.py .github/workflows/*.yml

      - name: Test packaging harness guards
        run: python3 -m unittest discover -s tests/packaging -p 'test_*.py' -v

      - name: Static and security audit
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --check)"
          if grep -RInE '#include[[:space:]]*[<\"](thread|pthread)|std::thread|std::async|pthread_|\b(poll|select|sleep|usleep|system|popen)[[:space:]]*\(' src include; then
            echo "prohibited production API found" >&2
            exit 1
          fi
          if grep -RInE 'AuthorizationGate|loopback[-_ ]only|private[-_ ]range|allowlist' src include; then
            echo "artificial production restriction found" >&2
            exit 1
          fi
          git status --short

  build-test-audit:
    if: always()
    needs:
      - core-tests
      - build-flavors
      - dynamic-analysis
      - benchmark
      - fuzz
      - static-security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify parallel validation
        shell: bash
        run: |
          test "${{ needs.core-tests.result }}" = "success"
          test "${{ needs.build-flavors.result }}" = "success"
          test "${{ needs.dynamic-analysis.result }}" = "success"
          test "${{ needs.benchmark.result }}" = "success"
          test "${{ needs.fuzz.result }}" = "success"
          test "${{ needs.static-security-audit.result }}" = "success"

  debian-package:
    needs: build-test-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Debian package in Debian 12
        run: |
          docker build --tag skan-debian12-builder --file tests/packaging/Dockerfile.builder .
          docker run --rm --network none \
            --volume "$PWD:/work" \
            --workdir /work \
            skan-debian12-builder \
            bash scripts/build_deb.sh

      - name: Validate package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name 'skan_*_amd64.deb' -print)
          test "${#packages[@]}" -eq 1
          docker run --rm \
            --volume "$PWD/dist:/dist:ro" \
            skan-debian12-builder \
            lintian --fail-on error "/dist/$(basename "${packages[0]}")"
          echo "path=${packages[0]}" >>"$GITHUB_OUTPUT"

      - name: Accept package on Debian 12
        run: |
          bash scripts/test_deb_package.sh \
            "${{ steps.package.outputs.path }}" \
            "debian:12@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443"

      - name: Accept package on Ubuntu 24.04
        run: |
          bash scripts/test_deb_package.sh \
            "${{ steps.package.outputs.path }}" \
            "ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517"

      - name: Validate release asset staging
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          bash scripts/prepare_release_assets.sh "$PACKAGE_PATH" release-assets
          (cd release-assets && sha256sum -c SHA256SUMS)

      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skan-debian-amd64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  privileged-private-lab:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install isolated-lab tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ethtool nmap tcpdump

      - name: Build Skan
        run: |
          make clean
          make -j2

      - name: Create isolated dual-stack namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns add skan-target
          sudo ip link add skan-lab type veth peer name target0
          sudo ip link set target0 netns skan-target
          sudo ip address add 192.0.2.1/30 dev skan-lab
          sudo ip -6 address add 2001:db8:29::1/64 dev skan-lab nodad
          sudo ip link set skan-lab up
          sudo ip netns exec skan-target ip link set lo up
          sudo ip netns exec skan-target ip address add 192.0.2.2/30 dev target0
          sudo ip netns exec skan-target ip -6 address add 2001:db8:29::2/64 dev target0 nodad
          sudo ip netns exec skan-target ip link set target0 up
          sudo ethtool -K skan-lab tx off rx off tso off gso off gro off
          sudo ip netns exec skan-target ethtool -K target0 tx off rx off tso off gso off gro off
          sudo ip netns exec skan-target sh -c 'nohup python3 -m http.server 8080 --bind 192.0.2.2 >/tmp/skan-http4.log 2>&1 &'
          sudo ip netns exec skan-target sh -c 'nohup python3 -m http.server 8081 --bind 2001:db8:29::2 >/tmp/skan-http6.log 2>&1 &'
          for attempt in {1..50}; do
            if curl --noproxy '*' --fail --silent --max-time 1 http://192.0.2.2:8080/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == "50" ]]; then
              sudo cat /tmp/skan-http4.log >&2 || true
              echo "IPv4 lab service did not become ready" >&2
              exit 1
            fi
            sleep 0.1
          done
          for attempt in {1..50}; do
            if curl --noproxy '*' --fail --silent --max-time 1 --globoff 'http://[2001:db8:29::2]:8081/' >/dev/null; then
              break
            fi
            if [[ "$attempt" == "50" ]]; then
              sudo cat /tmp/skan-http6.log >&2 || true
              echo "IPv6 lab service did not become ready" >&2
              exit 1
            fi
            sleep 0.1
          done

      - name: Validate raw IPv4 against Nmap
        run: |
          set -o pipefail
          mkdir -p validation_runs/ipv4
          sudo timeout 8 tcpdump -U -i skan-lab -nn -e -vvv -w validation_runs/ipv4/packet-evidence.pcap &
          sudo env SKAN_AUTHORIZED_LAB=1 SKAN_BIN="$PWD/bin/skan" VALIDATION_DIR="$PWD/validation_runs/ipv4" \
            ./scripts/privileged_validation.sh 192.0.2.2 8080,8082 skan-lab
          skan_output=$(find validation_runs/ipv4 -name '*_skan.txt' -print -quit)
          nmap_output=$(find validation_runs/ipv4 -name '*_nmap.txt' -print -quit)
          sudo tcpdump -nn -e -vvv -r validation_runs/ipv4/packet-evidence.pcap \
            | tee validation_runs/ipv4/packet-evidence.txt >/dev/null
          cat "$skan_output"
          cat "$nmap_output"
          cat validation_runs/ipv4/packet-evidence.txt
          grep -E '(^|[[:space:]])8080/tcp[[:space:]]+OPEN([[:space:]]|$)' "$skan_output"
          grep -E '8080/tcp[[:space:]]+open' "$nmap_output"
          grep -E '(^|[[:space:]])8082/tcp[[:space:]]+CLOSED([[:space:]]|$)' "$skan_output"
          grep -E '8082/tcp[[:space:]]+closed' "$nmap_output"

      - name: Validate raw IPv6 against Nmap
        run: |
          sudo env SKAN_AUTHORIZED_LAB=1 SKAN_BIN="$PWD/bin/skan" VALIDATION_DIR="$PWD/validation_runs/ipv6" \
            ./scripts/privileged_validation.sh 2001:db8:29::2 8081,8083 skan-lab
          skan_output=$(find validation_runs/ipv6 -name '*_skan.txt' -print -quit)
          nmap_output=$(find validation_runs/ipv6 -name '*_nmap.txt' -print -quit)
          cat "$skan_output"
          cat "$nmap_output"
          grep -E '(^|[[:space:]])8081/tcp[[:space:]]+OPEN([[:space:]]|$)' "$skan_output"
          grep -E '8081/tcp[[:space:]]+open' "$nmap_output"
          grep -E '(^|[[:space:]])8083/tcp[[:space:]]+CLOSED([[:space:]]|$)' "$skan_output"
          grep -E '8083/tcp[[:space:]]+closed' "$nmap_output"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privileged-private-lab-evidence
          path: validation_runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove isolated namespace
        if: always()
        run: sudo ip netns delete skan-target || true
