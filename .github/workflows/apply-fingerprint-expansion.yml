name: Apply fingerprint expansion

on:
  push:
    paths:
      - .github/workflows/apply-fingerprint-expansion.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write validated fingerprint databases
        shell: python
        env:
          SERVICE_B64: ''
          UDP_B64: ''
          OS4_B64: ''
          OS6_B64: ''
        run: |
          import base64, gzip, hashlib, os
          from pathlib import Path
          files = {
              'data/service-probes.db': (os.environ['SERVICE_B64'], '91bcc7ba4cbc2f35bc8ae7874e61e9d5b1272735dce74dbdcce9bb5b49d926ad'),
              'data/udp-probes.db': (os.environ['UDP_B64'], 'ded8a88000f20fa39e9de44371c1fe408b11ab76b10235670970f554d08f9144'),
              'data/os-fingerprints.db': (os.environ['OS4_B64'], '2886525e8263ec75e3a6ecf59ac6a69ef14a2da2b97dc283d68da2e6cffbc2c8'),
              'data/os-fingerprints-v6.db': (os.environ['OS6_B64'], '89d98e7f30118a774e0cd8fb69868fb880d50ad5c3283d421dbb055aa8b06cd4'),
          }
          for path, (encoded, expected) in files.items():
              raw = gzip.decompress(base64.b64decode(encoded))
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{path}: SHA-256 mismatch {actual} != {expected}')
              Path(path).write_bytes(raw)
              print(f'{path}: {actual}')
      - name: Commit fingerprint databases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/service-probes.db data/udp-probes.db data/os-fingerprints.db data/os-fingerprints-v6.db
          git diff --cached --check
          git commit -m 'data: expand service UDP and OS fingerprints'
          git push origin HEAD:main
